<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Daysaver | Sign Up</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="daysaver_loginpage_h1.css">
</head>
<body>
    <div class="main">
        <h1>Sign Up</h1>
        <form action="">
            <label for="first">Username</label>
            <input type="text" id="first" name="first" placeholder="Create a username">
            
            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="Create a password">
            
            <button type="submit">Create account</button>
        </form>
        <div class="login-link">
            Login <a href="daysaver_loginpage.html" title="Homepage">here</a>
        </div>
    </div>
</body>
</html>
