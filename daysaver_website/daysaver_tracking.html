<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Daysaver | Tracking</title>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
    />
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="/daysaver_tracking.css"> 
  </head>
  <body>
    <aside class="sidebar">
      <div class="sidebar-header">
        <img src="/daysaver_images/daysaverlogo.png" alt="" />
        <h2>Daysaver</h2>
      </div>
      <ul class="sidebar-links">
        <h4>
          <span>Main Menu</span>
          <div class="menu-separator"></div>
        </h4>
        <li>
          <a href="/dashboard">
            <span class="material-symbols-outlined"> dashboard </span> Dashboard </a>
        </li>
        <h4>
          <span>Finance</span>
          <div class="menu-separator"></div>
        </h4>
        <li>
          <a href="/tracking">
            <span class="material-symbols-outlined"> addchart </span> Tracking </a>
        </li>
        <li>
          <a href="/transactions">
            <span class="material-symbols-outlined"> overview </span> Transactions </a>
        </li>
        <h4>
          <span>Account</span>
          <div class="menu-separator"></div>
        </h4>
        <li>
          <a href="/logout">
            <span class="material-symbols-outlined"> logout </span> Logout </a>
        </li>
      </ul>
    </aside>

    <div class="dashboard-wrapper">
    <main class="content-container">
        <div class="form-card">
            <h2>Track Stipends & Savings</h2>
            
            <form action="/add_transaction" method="POST" class="tracking-form">
                <div class="form-group">
                    <label for="name">Transaction Name</label>
                    <input type="text" id="name" name="name" placeholder="e.g., Groceries, Paycheck, Coffee" required>
                </div>

                <div class="form-group">
                    <label for="type">Transaction Type</label>
                    <select id="type" name="type" required>
                        <option value="spending">Spending (Expense)</option>
                        <option value="saving">Saving (Stipend)</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="amount">Amount ($)</label>
                    <input type="text" id="amount" name="amount" placeholder="0.00" inputmode="decimal" required>
                </div>

                <div class="form-group">
                    <label for="date">Date</label>
                    <input type="date" id="date" name="date" required>
                </div>

                <button type="submit" class="btn-submit">Add Transaction</button>
            </form>
        </div>
    </main>
</div>


    <script>
      <!-- Calendar -->
    document.getElementById('date').value = new Date().toISOString().split('T')[0];
    </script>
  </body>
</html>
